<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timetetris</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <div class="logo">
                <i class="fas fa-puzzle-piece"></i>
                <span>timetetris</span>
            </div>
        </div>
        <div class="header-center">
            <div class="status-bar">
                <span id="participantCount"></span>
                <span class="separator">|</span>
                <span id="sessionCount"></span>
            </div>
        </div>
        <div class="header-right">
            <!-- 언어 선택 -->
            <div class="language-selector">
                <select id="languageSelect" onchange="app.changeLanguage(this.value)" class="language-select">
                    <option value="ko">한국어</option>
                    <option value="en">English</option>
                </select>
            </div>
            
            <button class="btn btn-icon" onclick="app.exportData()" data-i18n-title="header.export">
                <i class="fas fa-download"></i>
            </button>
            <button class="btn btn-icon" onclick="app.importData()" data-i18n-title="header.import">
                <i class="fas fa-upload"></i>
            </button>
            <button class="btn btn-icon" onclick="app.clearAll()" data-i18n-title="header.clear">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <button class="nav-item active" data-view="participants">
                    <i class="fas fa-users"></i>
                    <span data-i18n="nav.participants">참가자 관리</span>
                </button>
                <button class="nav-item" data-view="sessions">
                    <i class="fas fa-clock"></i>
                    <span data-i18n="nav.sessions">세션 관리</span>
                </button>
                <button class="nav-item" data-view="calendar">
                    <i class="fas fa-calendar-alt"></i>
                    <span data-i18n="nav.calendar">캘린더 뷰</span>
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Participants View -->
            <div id="participantsView" class="view-panel active">
                <div class="panel-header">
                    <h2 data-i18n="participants.title">참가자 관리</h2>
                    <button class="btn btn-primary" onclick="app.showParticipantModal()">
                        <i class="fas fa-plus"></i> <span data-i18n="participants.add">새 참가자 추가</span>
                    </button>
                </div>
                <div class="panel-body">
                    <div class="search-bar">
                        <input type="text" id="participantSearch" data-i18n-placeholder="participants.search" placeholder="참가자 검색..." class="search-input">
                    </div>
                    <div id="participantsList" class="items-list">
                        <!-- Participant list will be displayed here -->
                    </div>
                </div>
            </div>

            <!-- Sessions View -->
            <div id="sessionsView" class="view-panel">
            <div class="panel-header">
                <h2 data-i18n="sessions.title">세션 관리</h2>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="app.showSessionModal()">
                        <i class="fas fa-plus"></i> <span data-i18n="sessions.add">새 세션 추가</span>
                    </button>
                    <button class="btn btn-success" onclick="app.autoAssignAll()">
                        <i class="fas fa-magic"></i> <span data-i18n="sessions.auto_assign_all">전체 자동 배치</span>
                    </button>
                </div>
            </div>
                <div class="panel-body">
                    <div id="sessionsList" class="items-list">
                        <!-- Session list will be displayed here -->
                    </div>
                </div>
            </div>


            <!-- Calendar View -->
            <div id="calendarView" class="view-panel">
                <div class="panel-header">
                    <h2 data-i18n="calendar.title">캘린더 뷰</h2>
                    <div class="calendar-controls">
                        <!-- View switch buttons -->
                        <div class="view-switcher">
                            <button class="btn btn-sm" data-view="month" onclick="app.switchCalendarView('month')">
                                <i data-lucide="calendar"></i> <span data-i18n="calendar.month">월간</span>
                            </button>
                            <button class="btn btn-sm active" data-view="week" onclick="app.switchCalendarView('week')">
                                <i data-lucide="calendar-days"></i> <span data-i18n="calendar.week">주간</span>
                            </button>
                            <button class="btn btn-sm" data-view="day" onclick="app.switchCalendarView('day')">
                                <i data-lucide="calendar-clock"></i> <span data-i18n="calendar.day">일간</span>
                            </button>
                        </div>
                        
                        <!-- Date navigation -->
                        <div class="date-navigation">
                            <button class="btn btn-icon" onclick="app.navigateCalendar('prev')">
                                <i data-lucide="chevron-left"></i>
                            </button>
                            <button class="btn btn-sm" onclick="app.navigateCalendar('today')" data-i18n="calendar.today">오늘</button>
                            <button class="btn btn-icon" onclick="app.navigateCalendar('next')">
                                <i data-lucide="chevron-right"></i>
                            </button>
                        </div>
                        
                        <!-- Current date display -->
                        <div class="current-date-display">
                            <span id="calendarCurrentDate" data-i18n="calendar.current_date" data-i18n-args="2024,1">2024년 1월</span>
                        </div>
                    </div>
                </div>
                <div class="panel-body">
                    <!-- Custom calendar container -->
                    <div id="customCalendar" class="custom-calendar">
                        <!-- Calendar content will be dynamically generated by JavaScript -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Participant Modal -->
    <div id="participantModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 data-i18n="modal.participant.title">참가자 추가/편집</h3>
                <button class="modal-close" onclick="app.closeParticipantModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="participantForm">
                    <div class="form-group">
                        <label for="participantName"><span data-i18n="modal.participant.name">참가자 이름</span> <span data-i18n="common.required">*</span></label>
                        <input type="text" id="participantName" required data-i18n-placeholder="modal.participant.name_placeholder" placeholder="예: 김철수 학생">
                    </div>
                    <div class="form-group">
                        <label for="participantNote" data-i18n="modal.participant.note">메모</label>
                        <textarea id="participantNote" rows="3" data-i18n-placeholder="modal.participant.note_placeholder" placeholder="추가 정보를 입력하세요"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="participantPriority" data-i18n="modal.participant.priority">우선순위</label>
                        <input type="number" id="participantPriority" min="1" max="10" value="1">
                    </div>
                    <div class="form-group">
                        <label data-i18n="modal.participant.available_times">가능한 시간대</label>
                        <div id="availableSlots" class="time-slots">
                            <div class="time-slot">
                                <div class="time-slot-inputs">
                                    <div class="time-input-group">
                                        <label class="time-input-label" data-i18n="modal.participant.time_start">시작</label>
                                        <input type="datetime-local" class="slot-start-datetime">
                                    </div>
                                    <div class="time-input-group">
                                        <label class="time-input-label" data-i18n="modal.participant.time_end">종료</label>
                                        <input type="datetime-local" class="slot-end-datetime">
                                    </div>
                                </div>
                                <button type="button" class="btn btn-sm btn-danger" onclick="app.removeTimeSlot(this)">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <button type="button" class="btn btn-sm btn-secondary" onclick="app.addTimeSlot()">
                            <i class="fas fa-plus"></i> <span data-i18n="modal.participant.add_time">시간대 추가</span>
                        </button>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="app.closeParticipantModal()" data-i18n="modal.participant.cancel">취소</button>
                <button class="btn btn-primary" onclick="app.saveParticipant()" data-i18n="modal.participant.save">저장</button>
            </div>
        </div>
    </div>

    <!-- Session Modal -->
    <div id="sessionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 data-i18n="modal.session.title">세션 추가/편집</h3>
                <button class="modal-close" onclick="app.closeSessionModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="sessionForm">
                    <div class="form-group">
                        <label for="sessionName" data-i18n="modal.session.name">세션 이름</label>
                        <input type="text" id="sessionName" data-i18n-placeholder="modal.session.name_placeholder" placeholder="자동 생성됨">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="sessionEnabled" checked>
                                <span data-i18n="modal.session.active">활성화</span>
                            </label>
                        </div>
                        <div class="form-group">
                            <label for="sessionCapacity" data-i18n="modal.session.capacity">세션 용량 (명)</label>
                            <input type="number" id="sessionCapacity" min="1" max="20" value="1" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="sessionDateTime"><span data-i18n="modal.session.start_time">시작 시간</span> <span data-i18n="common.required">*</span></label>
                        <input type="datetime-local" id="sessionDateTime" required>
                    </div>
                    <div class="form-group">
                        <label for="sessionDuration"><span data-i18n="modal.session.duration">지속 시간 (분)</span> <span data-i18n="common.required">*</span></label>
                        <input type="number" id="sessionDuration" min="10" max="480" value="60" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="app.closeSessionModal()" data-i18n="modal.session.cancel">취소</button>
                <button class="btn btn-primary" onclick="app.saveSession()" data-i18n="modal.session.save">저장</button>
            </div>
        </div>
    </div>

    <!-- Import File Input (hidden) -->
    <input type="file" id="importFile" accept=".json" style="display: none">

    <!-- Scripts -->
    <!-- i18n 시스템 먼저 로드 -->
    <script src="js/i18n.js"></script>
    <!-- 모델 클래스들 (의존성 순서대로 로드) -->
    <script src="js/participant.js"></script>
    <script src="js/session.js"></script>
    <script src="js/data-store.js"></script>
    <!-- 애플리케이션 로직 -->
    <script src="js/custom-calendar.js"></script>
    <script src="js/time-tetris-app.js"></script>
</body>
</html>
